name: Build & Release

# 推 v* 标签时构建并发布；Actions 页也可手动触发（只构建不发版）。
# 写法沿用 ProxyZms 的 release.yml：原生 runner，不交叉编译——
# ring / liblzma 这些 C 依赖在 Mac 上交叉编 MSVC 编不过，原生构建则没有此问题。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            platform: windows
            package-types: nsis
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            package-types: nsis
          - name: macos-arm64
            os: macos-14
            platform: macos
            package-types: macos

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # binstall 拉预编译 dx；--disable-strategies compile 防止回退去编译 dioxus-cli
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@0.7.10 -y --force --disable-strategies compile

      - name: Test
        run: cargo test --workspace

      - name: Bundle
        run: dx bundle --release --platform ${{ matrix.platform }} --package-types ${{ matrix.package-types }}

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          setup=$(find target -iname '*setup*.exe' -path '*bundle*' | head -n1)
          if [ -z "$setup" ]; then echo "::error::未找到 NSIS 安装包"; exit 1; fi
          cp "$setup" "artifacts/yunpan-${{ matrix.name }}-setup.exe"

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          app=$(find target -type d -name '*.app' -path '*bundle*' | head -n1)
          if [ -z "$app" ]; then echo "::error::未找到 .app 产物"; exit 1; fi
          # ad-hoc 签名：没有任何签名的 app 在 Apple Silicon 上显示「已损坏」
          codesign --force --deep --sign - "$app"
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "云链盘" -srcfolder "$staging" -ov -format UDZO \
            "artifacts/yunpan-${{ matrix.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*

  relay:
    name: relay-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: relay-${{ matrix.arch }}
      - name: Build relay
        run: cargo build --release -p yunpan-relay
      - name: Collect
        run: |
          mkdir -p artifacts
          cp target/release/yunpan-relay "artifacts/yunpan-relay-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-${{ matrix.arch }}
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, relay]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
