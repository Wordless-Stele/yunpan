[package]
name = "yunpan-relay"
version = "0.1.0"
edition = "2021"
description = "云链盘中继端：跑在公网 Linux 服务器上的内网穿透中继"
publish = false

[[bin]]
name = "yunpan-relay"
path = "src/main.rs"

[dependencies]
yunpan-tunnel = { path = "../tunnel" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
