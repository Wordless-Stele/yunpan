name: Build & Release

# 三个产物，全部 x86_64：
#   客户端 Linux   → ubuntu-22.04 托管 runner（22.04 的 glibc 老，deb/AppImage 能跑在更多发行版上）
#   客户端 Windows → windows-latest 托管 runner（NSIS 安装包；ring/liblzma 必须原生编）
#   中继 Linux     → 自建 runner（与生产机 8.155.35.38 的 glibc 兼容已被 parkwise 验证）
# 推 v* 标签构建并发 Release；Actions 页手动触发只构建不发版。
# 平时只更新中继用 build-relay.yml（自建 runner，零计费秒排队）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  client-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Dioxus 桌面端在 Linux 上经 wry/tao 依赖 webkit2gtk 全家；托盘要 appindicator
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: client-linux-x64

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # binstall 拉预编译 dx；--disable-strategies compile 防止回退去编译 dioxus-cli
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@0.7.10 -y --force --disable-strategies compile

      # 质量闸门放在这一个 job 里跑一次即可（Windows 上跑一遍是重复花钱）
      - name: Test
        run: cargo test --workspace

      - name: Bundle (deb + AppImage)
        run: dx bundle --release --platform linux --package-types deb --package-types appimage

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          deb=$(find target -name '*.deb' -path '*bundle*' | head -n1)
          appimage=$(find target -iname '*.AppImage' -path '*bundle*' | head -n1)
          [ -n "$deb" ] || { echo "::error::未找到 .deb 产物"; exit 1; }
          cp "$deb" artifacts/yunpan-client-linux-x64.deb
          [ -n "$appimage" ] && cp "$appimage" artifacts/yunpan-client-linux-x64.AppImage || echo "无 AppImage，跳过"

      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-x64
          path: artifacts/*

  client-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: client-windows-x64

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@0.7.10 -y --force --disable-strategies compile

      - name: Bundle (NSIS)
        run: dx bundle --release --platform windows --package-types nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          setup=$(find target -iname '*setup*.exe' -path '*bundle*' | head -n1)
          [ -n "$setup" ] || { echo "::error::未找到 NSIS 安装包"; exit 1; }
          cp "$setup" artifacts/yunpan-client-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-x64
          path: artifacts/*

  relay-linux-x64:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5

      # runner 以 systemd 服务跑，非登录 shell 不 source ~/.profile
      - name: Expose local toolchains on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release -p yunpan-relay

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp target/release/yunpan-relay artifacts/yunpan-relay-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: relay-linux-x64
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client-linux-x64, client-windows-x64, relay-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
