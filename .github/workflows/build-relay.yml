name: Build Relay (self-hosted)

# 只编 Linux 中继二进制，跑在自建 runner 上（与 parkwise 同一台，产物与生产机的 glibc 兼容已被验证）。手动触发，产物走 artifact。
# 生产服务器不装工具链——它只收编好的二进制。
on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      # runner 以 systemd 服务跑，非登录 shell 不 source ~/.profile，
      # ~/.cargo/bin 不在 PATH 上（与 parkwise 的 workflow 同一处坑）
      - name: Expose local toolchains on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release -p yunpan-relay
      - name: Sanity
        run: |
          file target/release/yunpan-relay
          target/release/yunpan-relay --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: yunpan-relay-linux-x64
          path: target/release/yunpan-relay
