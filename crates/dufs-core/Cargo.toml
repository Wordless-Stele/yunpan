[package]
name = "dufs-core"
version = "0.46.0"          # 跟随被 vendor 的 dufs 上游版本，不跟云链盘的版本走
edition = "2021"
license = "MIT OR Apache-2.0"
description = "dufs v0.46.0 的库化内嵌版本，供云链盘在进程内直接起文件服务"
publish = false

# 依赖表逐字照抄 dufs v0.46.0，只删了 clap / clap_complete（命令行解析已剥离）。
# 升级 dufs 时对着上游 Cargo.toml 重新比一遍。
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net", "sync"] }
tokio-util = { version = "0.7", features = ["io-util", "compat"] }
hyper = { version = "1", features = ["http1", "server"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
async_zip = { version = "0.0.18", default-features = false, features = ["deflate", "bzip2", "xz", "chrono", "tokio"] }
headers = "0.4"
mime_guess = "2.0"
if-addrs = "0.15"
# 上游用 tokio-rustls 默认特性（aws-lc-rs 后端），但 aws-lc-sys 从 Mac 交叉编译
# Windows 需要 NASM，本机验证不了。换 ring 后端：功能等价，纯 cc 就能交叉编译。
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "logging", "tls12"] }
md5 = "0.8"
lazy_static = "1.4"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
urlencoding = "2.1"
xml-rs = "1.0.0"
log = { version = "0.4", features = ["std"] }
socket2 = "0.6"
async-stream = "0.3"
walkdir = "2.3"
form_urlencoded = "1.2"
alphanumeric-sort = "1.4"
content_inspector = "0.2"
anyhow = "1.0"
chardetng = "1.0"
glob = "0.3"
indexmap = "2.2"
serde_yaml = "0.9"
sha-crypt = "0.6"
base64 = "0.22"
smart-default = "0.7"
rustls-pki-types = "1.2"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1.5"
pin-project-lite = "0.2"
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
hex = "0.4.3"

[features]
default = ["tls"]
tls = ["tokio-rustls"]

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
