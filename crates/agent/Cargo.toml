[package]
name = "yunpan-agent"
version = "0.1.0"
edition = "2021"
description = "云链盘 MCP Agent：让 AI 通过 MCP 工具上传/下载/检索共享盘里的文件"
publish = false

[[bin]]
name = "yunpan-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
futures-util = { version = "0.3", default-features = false }
# rustls 而不是原生 TLS：走中继的 https 也能连，且交叉编译不挑平台
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2"

[dev-dependencies]
dufs-core = { path = "../dufs-core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
