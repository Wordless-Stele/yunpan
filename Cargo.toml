[package]
name = "yunpan"
version = "0.1.0"
edition = "2021"
authors = ["ZHOUMAOSEN"]
description = "云链盘 —— 内嵌 dufs 的文件共享端，带系统托盘与内网穿透"
publish = false

# 根包就是 Windows 端 GUI，成员是被它内嵌的库与中继端二进制。
# 中继端虽然只跑在 Linux，但代码是纯 Rust，Mac 上也编得过 —— 这样本机就能起一个
# 中继做端到端联调，不必每次都往服务器上传。
[workspace]
members = ["crates/agent", "crates/dufs-core", "crates/tunnel", "crates/relay-server"]

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
dufs-core = { path = "crates/dufs-core" }
yunpan-tunnel = { path = "crates/tunnel" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rfd = "0.15"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

# 单文件分发，体积越小越好：LTO + 单编译单元，去掉 panic 展开。
# 注意 panic = "abort" 会让 dufs 里靠 unwind 兜底的地方直接终止进程 —— 但那些地方
# 本来也只有 bug 才会走到，宁可当场死掉留个明确的崩溃，也别带着半坏的状态跑下去。
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
